name: Validate collection

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate collection
        run: python scripts/validate_collection.py
      - name: Test acceptance boundaries
        run: python -m unittest discover -s tests -v

  react-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluations/runtime/react-performance-review
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: evaluations/runtime/react-performance-review/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Type-check fixture
        run: npm run typecheck
      - name: Run browser acceptance
        run: npm test
